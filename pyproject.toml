[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aisha-ai"
version = "1.0.0"
description = "Autonomous Hindi voice assistant for Windows — screen vision, Live2D avatar, PC automation."
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
aisha = "aisha.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the bundled Live2D web runtime, model, textures, fonts, etc.
"*" = ["**/*.html", "**/*.js", "**/*.json", "**/*.png", "**/*.moc3", "**/*.ttf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
